[package]
name = "pomodoro"
version = "0.3.6"
description = "yet another pomodoro timer"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Pomodoro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.7.0"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
